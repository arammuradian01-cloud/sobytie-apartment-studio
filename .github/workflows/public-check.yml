name: Check anonymous public sites
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser checker
        run: |
          npm install --prefix /tmp/sobytie-public-check playwright@1.65.0
          /tmp/sobytie-public-check/node_modules/.bin/playwright install --with-deps chromium
      - name: Check both domains without authentication
        run: node scripts/check-public-sites.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anonymous-public-site-check
          path: output/playwright/
